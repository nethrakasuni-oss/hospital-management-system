services:
  postgres:
    image: postgres:17
    container_name: hms-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: hms_admin
      POSTGRES_PASSWORD: Hms12345
      POSTGRES_DB: hms_db

    ports:
      - "5432:5432"

    volumes:
      - hms_postgres_data:/var/lib/postgresql/data

volumes:
  hms_postgres_data: